<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Parity — verifiable pay-gap reporting on Midnight">
  <title>Parity — verifiable pay-gap reporting</title>
  <!--
    X crops this hard on mobile and the avatar covers the lower left, so the
    claim sits centre-right and everything important stays inside the middle
    band: roughly x 380-1400, y 120-380.
  -->
  <defs>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9838"/>
      <stop offset="1" stop-color="#F26F1A"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="#FFF9F2"/>
  <!-- warm blob, echoing the rounded shapes the product uses behind its panels -->
  <ellipse cx="1290" cy="250" rx="330" ry="260" fill="#FDEBD8"/>
  <ellipse cx="120" cy="440" rx="260" ry="200" fill="#FDEBD8" opacity="0.7"/>

  <g transform="translate(380, 152)">
    <rect width="126" height="126" rx="30" fill="url(#o)"/>
    <path fill="#ffffff" fill-rule="evenodd"
          d="M38 28 H71 A21 21 0 0 1 71 70 H55 V98 H38 Z
             M55 41 H71 A8 8 0 0 1 71 57 H55 Z"/>
  </g>

  <text x="548" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="74" font-weight="650" letter-spacing="-2" fill="#33404F">Parity</text>

  <text x="548" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="28" fill="#6B7A8C">A gender pay-gap filing that can be verified —</text>
  <text x="548" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="28" fill="#6B7A8C">without anyone seeing a single salary.</text>

  <rect x="548" y="336" width="54" height="5" rx="2.5" fill="#F26F1A"/>

  <text x="548" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" letter-spacing="0.6" fill="#F26F1A" font-weight="600">Built on Midnight</text>
  <text x="762" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" fill="#C9B9A6">·</text>
  <text x="784" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" letter-spacing="0.6" fill="#6B7A8C">parity-tech.vercel.app</text>
</svg>
