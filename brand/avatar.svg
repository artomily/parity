<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="400" height="400" role="img" aria-label="Parity">
  <title>Parity</title>
  <!--
    Two bars of exactly equal height — that equality is the name. The left is
    solid (the aggregate that becomes public); the right is a sealed outline
    (the same magnitude, proved but never revealed). They share one baseline:
    both come out of the same circuit. Reads correctly down to a 32px favicon.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4fd8"/>
      <stop offset="1" stop-color="#0f7b4f"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="72" fill="url(#g)"/>

  <rect x="94" y="82" width="54" height="146" rx="16" fill="#ffffff"/>
  <rect x="172" y="82" width="54" height="146" rx="16" fill="none" stroke="#ffffff" stroke-width="14"/>

  <rect x="76" y="244" width="168" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.55"/>
</svg>
