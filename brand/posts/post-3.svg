<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9838"/><stop offset="1" stop-color="#F26F1A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#BE8246" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#FFF9F2"/>

  <text x="110" y="128" font-size="23" font-weight="650" letter-spacing="3.2" fill="#F26F1A">THE DISCLOSURE SURFACE</text>
  <text x="110" y="212" font-size="54" font-weight="650" letter-spacing="-1.6" fill="#33404F">What Parity publishes, and what it never sends.</text>

  <g filter="url(#sh)">
    <rect x="110" y="272" width="654" height="424" rx="22" fill="#ffffff" stroke="#F0E4D6"/>
    <rect x="836" y="272" width="654" height="424" rx="22" fill="#ffffff" stroke="#F0E4D6"/>
  </g>

  <circle cx="172" cy="342" r="24" fill="#FFF4E8"/>
  <circle cx="172" cy="342" r="8" fill="#2E9E6B"/>
  <text x="214" y="352" font-size="25" font-weight="650" letter-spacing="1.6" fill="#2E9E6B">PUBLIC ON-CHAIN</text>

  <text x="172" y="432" font-size="29" fill="#33404F">·   the payroll's Merkle root</text>
  <text x="172" y="500" font-size="29" fill="#33404F">·   each group's headcount and total pay</text>
  <text x="172" y="568" font-size="29" fill="#33404F">·   how many workers confirmed</text>
  <text x="172" y="646" font-size="22" fill="#6B7A8C">Anyone can read and re-check these.</text>

  <circle cx="898" cy="342" r="24" fill="#FFF4E8"/>
  <rect x="892" y="336" width="12" height="11" rx="2" fill="#F26F1A"/>
  <path d="M894 336 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#F26F1A" stroke-width="2.4"/>
  <text x="940" y="352" font-size="25" font-weight="650" letter-spacing="1.6" fill="#F26F1A">NEVER TRANSMITTED</text>

  <text x="898" y="432" font-size="29" fill="#33404F">·   every individual salary</text>
  <text x="898" y="500" font-size="29" fill="#33404F">·   which row is yours</text>
  <text x="898" y="568" font-size="29" fill="#33404F">·   what the employer filed about you</text>
  <text x="898" y="646" font-size="22" fill="#6B7A8C">Used inside the circuit, then discarded.</text>

  <text x="110" y="790" font-size="40" font-weight="650" letter-spacing="-1.2" fill="#33404F">One circuit computes both — so the figure cannot come</text>
  <text x="110" y="842" font-size="40" font-weight="650" letter-spacing="-1.2" fill="#33404F">from a payroll other than the one committed.</text>
</svg>
