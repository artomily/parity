name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm install
        run: npm install

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: compact compile
        run: |
          # Pinned: `compact update` with no argument installs whatever the
          # latest toolchain is, and 0.34.0 requires language version 0.26.0
          # while contracts/parity.compact declares 0.23. Bump this together
          # with the pragma and the @midnight-ntwrk/* runtime versions.
          compact update 0.31.1
          compact --version
          npm run compact

      - name: Run test suite
        run: npm test
